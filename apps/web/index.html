<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>%VITE_APP_NAME%</title>

    <meta content="website" property="og:type">

    <meta content="%VITE_APP_NAME%" property="og:title">

    <meta content="/og_image.png" property="og:image">

    <meta content="#fff" name="theme-color">
    <script>
    "use strict";
    (() => {
      try {
        const stored = JSON.parse(localStorage.getItem("ui-store") || "{}");
        const theme = stored?.state?.theme;
        const prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)"
        ).matches;
        const resolved =
          theme === "dark" || (theme !== "light" && prefersDark)
            ? "dark"
            : "light";
        document.documentElement.classList.add(resolved);
      } catch {
        document.documentElement.classList.add("light");
      }
    })();
    </script>
  </head>

  <body>
    <div id="app"></div>
    <script src="/src/main.tsx" type="module"></script>
  </body>
</html>
